name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1'   # Weekly on Monday at 03:00 UTC

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Link VS build tasks for WinUI 3
        shell: pwsh
        run: |
          $sdkVer = & dotnet --version
          $target = "C:\Program Files\dotnet\sdk\$sdkVer\Microsoft\VisualStudio\v17.0"
          $vsSource = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VisualStudio\v17.0"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          cmd /c mklink /J "$target\AppxPackage" "$vsSource\AppxPackage"

      - name: Restore
        run: dotnet restore VidPare.sln

      - name: Build for CodeQL
        run: dotnet build VidPare.sln --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
